# ── Input FASTQ directories ────────────────────────────────────────────────────
# Tumor FASTQs: expects files named *_T[1-5]_R1.fastq.gz / *_T[1-5]_R2.fastq.gz
tumor_fastq_dir: "FASTQ_merged_Tumours"

# Normal FASTQs: expects files named *_GL_R1.fastq.gz / *_GL_R2.fastq.gz
normal_fastq_dir: "FASTQ_merged_Normals"

# ── Output directory ──────────────────────────────────────────────────────────
outdir: "results"

# ── Reference genome ──────────────────────────────────────────────────────────
ref_genome: "/path/to/GCA_000001405.15_GRCh38_no_alt_analysis_set.fasta"

# ── Target regions (BED files) ────────────────────────────────────────────────
amplicon_bed: "/path/to/amplicon.bed"
targets_bed:  "/path/to/targets.bed"

# ── ConsensusCruncher ─────────────────────────────────────────────────────────
consensus_cruncher: "/path/to/ConsensusCruncher.py"
umi_index:          "/path/to/IDT_dual_Index.txt"
cytoband:           "/path/to/hg38_cytoBand.txt"

# ── Tool paths ────────────────────────────────────────────────────────────────
bwa_path:      "/path/to/bwa"
samtools_path: "/path/to/samtools"
picard_jar:    "/path/to/picard.jar"

# ── GATK resources ────────────────────────────────────────────────────────────
gnomad_vcf: "/path/to/af-only-gnomad.hg38.vcf.gz"

# ── Annotation ────────────────────────────────────────────────────────────────
vep_cache:  "/path/to/vep_cache/GRCh38/98"
annovar_db: "/path/to/annovar/humandb"
